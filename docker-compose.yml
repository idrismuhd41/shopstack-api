services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: shopstack-db-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: shopstack_dev
      POSTGRES_DB: shopstack
    ports:
      - "5433:5432"  # 5433 on host to avoid conflict with the standalone postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopstack -d shopstack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API ────────────────────────────────────────────────────
  api:
    build: .
    container_name: shopstack-api-compose
    restart: unless-stopped
    stop_grace_period: 15s 
    
    depends_on:
      db:
        condition: service_healthy  # ← wait for db healthcheck to pass
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://shopstack:shopstack_dev@db:5432/shopstack?schema=public
      JWT_SECRET: dev-secret-change-me-in-prod
      JWT_EXPIRES_IN: 1h
      API_KEY: dev-api-key-change-me
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: "10"
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      stop_grace_period: 15s
