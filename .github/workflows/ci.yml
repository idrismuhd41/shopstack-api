name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopstack
          POSTGRES_PASSWORD: shopstack_dev
          POSTGRES_DB: shopstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopstack -d shopstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://shopstack:shopstack_dev@localhost:5432/shopstack_test?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://shopstack:shopstack_dev@localhost:5432/shopstack_test?schema=public
          JWT_SECRET: ci-test-jwt-secret-not-real
          JWT_EXPIRES_IN: 1h
          API_KEY: ci-test-api-key
          CORS_ORIGIN: http://localhost:5173
          BCRYPT_ROUNDS: '4'

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: test -f dist/server.js
